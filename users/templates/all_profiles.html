<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Все профили</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Все профили пользователей</h1>
                {% if not user.is_authenticated %}
                    <div class="auth-notice">
                        <p>Вы не вошли в систему</p>
                        <a href="{% url 'login' %}" class="btn btn-primary">Войти</a>
                    </div>
                {% else %}
                    <div class="user-menu">
                        <a href="{% url 'profile' %}" class="btn btn-secondary">Мой профиль</a>
                    </div>
                {% endif %}
            </header>

            <main>
                {% if users %}
                    <div class="profiles-grid">
                        {% for user in users %}
                            <a href="{% url 'user_profile' user.id %}" class="profile-link">
                                <div class="profile-card">
                                    <div class="profile-info">
                                        <h3>{{ user.username }}</h3>
                                        <p>Пользователь #{{ user.id }}</p>
                                    </div>
                                </div>
                            </a>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="empty-state">
                        <p>Нет зарегистрированных аккаунтов</p>
                    </div>
                {% endif %}
            </main>
        </div>
    </body>
</html>
