<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Вход</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <h2>Логин</h2>

        <form method="post">
            {% csrf_token %}
            <p>Юзернейм: {{ form.username }}</p>
            <p>Пароль: {{ form.password }}</p>

            {% if form.errors %}
                <div class="error-list">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p class="error-field">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit">Войти</button>
        </form>

        <h3>Нет аккаунта? Тогда <a href="{% url 'registration' %}">зарегистрируйтесь</a>.</h3>
        <h3><a href="{% url 'all_profiles' %}">На главную</a></h3>
    </body>
</html>
